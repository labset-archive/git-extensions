version: "2"

formatters:
  enable:
    - gofmt
    - goimports
    - golines

linters:
  default: "all"
  disable:
    - exhaustruct
    - ireturn
    - revive
    - mnd
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/viqueen/git-extensions
            - github.com/stretchr/testify
            - github.com/spf13/cobra
            - github.com/manifoldco/promptui
